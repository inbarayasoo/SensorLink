name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-build-test:
    name: Host build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ gcovr

      # GoogleTest is fetched from GitHub at configure time (see
      # tests/CMakeLists.txt) and pinned to a fixed tag, so the download is
      # identical on every run until that tag changes -- a safe cache key.
      - name: Cache GoogleTest checkout
        uses: actions/cache@v4
        with:
          path: build/coverage/_deps
          key: googletest-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}

      # The "coverage" preset builds the same server/client/proto targets as
      # "host", just instrumented with --coverage (see CMakeLists.txt), so
      # one configure+build+test here covers both the build check and the
      # coverage number -- no need to build twice.
      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Measure coverage
        run: |
          gcovr --root . --object-directory build/coverage \
                --filter 'proto/' --filter 'server/' --filter 'client/' \
                --print-summary | tee coverage-summary.txt
          {
            echo "### Coverage summary"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  firmware-build:
    name: Firmware build (ARM Cortex-M3)
    runs-on: ubuntu-latest
    env:
      ARM_TOOLCHAIN_VERSION: 13.2.rel1
    steps:
      # recursive: the FreeRTOS kernel is a git submodule (third_party/FreeRTOS-Kernel)
      # and the firmware will not configure without its sources present.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      # Ubuntu's own gcc-arm-none-eabi apt package has a long-standing
      # packaging bug: its C++ headers (cstdint, cstddef, ...) are missing
      # from the search path, so any C++ translation unit fails to compile.
      # Fetching the toolchain directly from ARM's own releases avoids that
      # bug entirely and, pinned to 13.2.1, matches the version used for
      # local development.
      - name: Install ARM GNU Toolchain
        run: |
          curl -L -o arm-toolchain.tar.xz \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          mkdir -p "$HOME/arm-toolchain"
          tar -xf arm-toolchain.tar.xz -C "$HOME/arm-toolchain" --strip-components=1
          echo "$HOME/arm-toolchain/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset firmware

      - name: Build
        run: cmake --build --preset firmware

      - name: Report firmware size
        run: |
          {
            echo "### Firmware size (arm-none-eabi-size)"
            echo '```'
            arm-none-eabi-size build/firmware/node/sensorlink-node.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: QEMU + server integration test
    runs-on: ubuntu-latest
    env:
      ARM_TOOLCHAIN_VERSION: 13.2.rel1
    # No point booting QEMU and waiting through the test's timing windows if
    # either half does not even build on its own.
    needs: [host-build-test, firmware-build]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qemu-system-arm

      # Same bug, same fix as firmware-build -- see the comment there.
      - name: Install ARM GNU Toolchain
        run: |
          curl -L -o arm-toolchain.tar.xz \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          mkdir -p "$HOME/arm-toolchain"
          tar -xf arm-toolchain.tar.xz -C "$HOME/arm-toolchain" --strip-components=1
          echo "$HOME/arm-toolchain/bin" >> "$GITHUB_PATH"

      - name: Build host (server, client, load generator)
        run: |
          cmake --preset host
          cmake --build --preset host

      - name: Build firmware
        run: |
          cmake --preset firmware
          cmake --build --preset firmware

      - name: Run integration test
        run: python3 tests/integration/run_integration_test.py

      # run_integration_test.py writes each subprocess's log (server, qemu,
      # load_generator) under a fresh tempfile.mkdtemp(prefix=...) directory
      # and prints its path -- glob for it here rather than parsing that
      # line out of the step's own stdout.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: /tmp/sensorlink-integration-*/

  static-analysis:
    name: Static analysis (clang-tidy + cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ clang-tidy cppcheck

      # clang-tidy needs a compile_commands.json to know each file's include
      # paths and flags. Configuring (not building) the host preset is
      # enough to generate one for server/. node/ is left out of clang-tidy
      # on purpose: it only compiles under the arm-none-eabi cross toolchain
      # against vendored FreeRTOS/CMSIS headers, which a host
      # compile_commands.json cannot describe. cppcheck below, which does
      # not need a compile database, still covers it.
      - name: Configure (for compile_commands.json)
        run: cmake --preset host -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # proto/ is a header-only INTERFACE library (see proto/CMakeLists.txt):
      # it has no .cpp of its own, so it has no direct entry in
      # compile_commands.json. server/*.cpp is what actually includes the
      # proto/ headers (frame_parser.hpp, messages.hpp, ...), so running
      # clang-tidy on those translation units, with --header-filter
      # widened to include proto/, gets both directories analyzed through
      # the real include graph instead of guessing flags for a header in
      # isolation.
      - name: clang-tidy (proto/, server/)
        run: |
          find server -name '*.cpp' \
            | xargs clang-tidy -p build/host --header-filter='(proto|server)/'

      # node/cmsis is vendored upstream code (see node/CMakeLists.txt),
      # not ours to fix -- -i node/cmsis keeps cppcheck from starting a
      # check there, and --suppress=*:node/cmsis/* additionally drops any
      # finding cppcheck still reports inside it when it's pulled in via
      # #include from a file that is being checked.
      #
      # -I . (not -I proto/-I server/-I node): every #include in this repo
      # is written relative to the repository root (see e.g.
      # server/CMakeLists.txt's target_include_directories), so that is the
      # one include root that actually resolves them.
      #
      # missingInclude/missingIncludeSystem are suppressed outright: this
      # job does not check out the FreeRTOS-Kernel submodule (kept fast on
      # purpose, see the checkout step above), so node/'s FreeRTOS.h/
      # task.h/... never resolve, and cppcheck does not ship libstdc++'s
      # own headers either -- neither is a finding to act on.
      #
      # unusedFunction is suppressed because this invocation only sees
      # proto/, server/, and node/ -- not client/ or tests/, which is where
      # most of these public accessors are actually called from. Without a
      # whole-program view, cppcheck flags essentially every public getter
      # as dead code, which is noise, not a finding.
      #
      # cstyleCast is suppressed under node/ specifically: register-access
      # macros in the vendored CMSIS headers (e.g. CMSDK_UART0, defined as
      # a C-style cast in node/cmsis/CMSDK_CM3.h) expand at their call site,
      # so cppcheck attributes the finding to whichever of our files uses
      # the macro, not to the vendor header -i node/cmsis already excludes.
      # proto/ and server/ keep the check -- a C-style cast there would be
      # a real style issue.
      - name: cppcheck (proto/, server/, node/)
        run: |
          cppcheck --enable=all --error-exitcode=1 --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=toomanyconfigs \
            --suppress=unusedFunction \
            --suppress='cstyleCast:node/*' \
            --suppress='*:node/cmsis/*' \
            -I . -I node/cmsis \
            -i node/cmsis \
            proto server node
