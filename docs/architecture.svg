<svg xmlns="http://www.w3.org/2000/svg" width="680" height="296" viewBox="0 0 680 296" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>SensorLink cold-chain telemetry flow</title>
  <desc>Identical temperature sensor nodes (warehouse freezer, truck cargo bay, pharmacy fridge) send COBS-framed, CRC-16-checked binary packets over TCP to one Linux server running a single-threaded epoll event loop. The server parses frames, keeps a recent-history ring buffer per device in memory, and streams data to consumer programs over a line-based text protocol. A return channel carries CONFIG, SLOW_DOWN and HEARTBEAT messages from the server back to the nodes, closing an end-to-end backpressure loop.</desc>

  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#7a7970" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#d0562e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="296" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="679" height="295" fill="none" stroke="#e6e4db" stroke-width="1"/>

  <text x="248" y="40" text-anchor="middle" font-size="11.5" fill="#6b6a63">COBS + CRC-16 frames over TCP</text>
  <text x="458" y="40" text-anchor="middle" font-size="11.5" fill="#6b6a63">text: subscribe / stats</text>

  <rect x="40" y="52" width="176" height="184" rx="10" fill="none" stroke="#a7a69d" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="128" y="72" text-anchor="middle" font-size="13.5" font-weight="600" fill="#24231d">Sensor nodes</text>
  <text x="128" y="88" text-anchor="middle" font-size="11.5" fill="#6b6a63">one temp probe each</text>
  <text x="128" y="103" text-anchor="middle" font-size="11" fill="#8a897f">ARM Cortex-M &#183; FreeRTOS &#183; QEMU</text>

  <rect x="54" y="112" width="148" height="30" rx="6" fill="#f2f0e9" stroke="#c4c2b8" stroke-width="1"/>
  <text x="128" y="131" text-anchor="middle" font-size="12.5" font-weight="500" fill="#2c2b26">Warehouse freezer</text>

  <rect x="54" y="148" width="148" height="30" rx="6" fill="#f2f0e9" stroke="#c4c2b8" stroke-width="1"/>
  <text x="128" y="167" text-anchor="middle" font-size="12.5" font-weight="500" fill="#2c2b26">Truck cargo bay</text>

  <rect x="54" y="184" width="148" height="30" rx="6" fill="#f2f0e9" stroke="#c4c2b8" stroke-width="1"/>
  <text x="128" y="203" text-anchor="middle" font-size="12.5" font-weight="500" fill="#2c2b26">Pharmacy fridge</text>

  <line x1="218" y1="150" x2="276" y2="150" stroke="#7a7970" stroke-width="1.3" fill="none" marker-end="url(#af)"/>

  <rect x="280" y="118" width="152" height="64" rx="8" fill="#dff3ec" stroke="#1d9e75" stroke-width="1"/>
  <text x="356" y="143" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0c4a3b">SensorLink server</text>
  <text x="356" y="162" text-anchor="middle" font-size="11.5" fill="#0c4a3b" opacity="0.82">Linux, epoll event loop</text>

  <line x1="434" y1="150" x2="484" y2="150" stroke="#7a7970" stroke-width="1.3" fill="none" marker-end="url(#af)"/>

  <rect x="486" y="82" width="160" height="138" rx="10" fill="none" stroke="#a7a69d" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="566" y="102" text-anchor="middle" font-size="13.5" font-weight="600" fill="#24231d">Consumers</text>
  <text x="566" y="118" text-anchor="middle" font-size="11.5" fill="#6b6a63">cold-chain QA room</text>

  <rect x="499" y="132" width="134" height="30" rx="6" fill="#f2f0e9" stroke="#c4c2b8" stroke-width="1"/>
  <text x="566" y="151" text-anchor="middle" font-size="12.5" font-weight="500" fill="#2c2b26">Live dashboard</text>

  <rect x="499" y="174" width="134" height="30" rx="6" fill="#f2f0e9" stroke="#c4c2b8" stroke-width="1"/>
  <text x="566" y="193" text-anchor="middle" font-size="12.5" font-weight="500" fill="#2c2b26">Alerting client</text>

  <path d="M356 182 L356 270 L52 270 L52 238" fill="none" stroke="#d0562e" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="204" y="264" text-anchor="middle" font-size="11.5" fill="#9e4020">CONFIG &#183; SLOW_DOWN &#183; HEARTBEAT</text>
</svg>
